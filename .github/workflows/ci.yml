name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm, unix: true }
          - { name: linux-x86_64, os: ubuntu-24.04, unix: true, rustflags: "-C target-cpu=x86-64-v2" }
          - { name: macos-arm64, os: macos-14, unix: true }
          - { name: windows-x86_64, os: windows-2022, unix: false }
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: flac tool (for the CLI tests)
        if: matrix.unix
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get install -y flac; else brew install flac; fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --locked -p samplepack -p samplepack-capi -- -D warnings
          cargo clippy --locked -p samplepack-tests -p samplepack-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
        env:
          SAMPLEPACK_NO_FLAC: ${{ matrix.unix && 'no' || '1' }}
      - name: No panic paths in the static library
        if: matrix.unix
        run: sh tools/check-no-panic.sh
      - name: Fuzz runs (decoder against the C oracle, pack reader)
        if: matrix.unix
        run: sh tools/run-fuzz.sh 50000 1
